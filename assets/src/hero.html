<!doctype html><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; }
  body { width:1600px; height:460px; background:#FCFCFD; font-family:"Helvetica Neue",Inter,"Noto Sans CJK SC","PingFang SC",sans-serif;
         background-image:radial-gradient(#E4E4E9 1.2px, transparent 1.2px); background-size:28px 28px; }
  .wrap { height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 84px; }
  .eyebrow { font-size:13px; letter-spacing:.22em; color:#8E8E96; font-weight:600; margin-bottom:26px; }
  h1 { font-size:86px; font-weight:700; color:#101014; letter-spacing:-.02em; line-height:1; }
  h1 .dot { color:#DC2626; }
  .tag-en { margin-top:26px; font-size:25px; color:#3F3F46; font-weight:500; }
  .tag-zh { margin-top:10px; font-size:21px; color:#8E8E96; }
  .stack { position:relative; width:480px; height:300px; }
  .card { position:absolute; width:400px; background:#fff; border:1px solid #E8E8EC; border-radius:16px;
          box-shadow:0 1px 3px rgba(16,16,20,.05), 0 16px 40px rgba(16,16,20,.06); padding:26px 30px; }
  .c1 { top:0; right:40px; transform:rotate(2.5deg); }
  .c2 { top:150px; right:90px; transform:rotate(-1.5deg); }
  .lbl { font-size:11px; letter-spacing:.2em; color:#A1A1AA; font-weight:600; margin-bottom:12px; }
  .verdict { font-family:"DejaVu Sans Mono",monospace; font-size:21px; font-weight:700; }
  .no { color:#DC2626; } .yes { color:#059669; }
  .sub { margin-top:8px; font-size:14px; color:#8E8E96; }
</style>
<div class="wrap">
  <div>
    <div class="eyebrow">SKILL FOR AI AGENTS · MIT LICENSE</div>
    <h1>delivery-audit<span class="dot">.</span></h1>
    <div class="tag-en">Adversarial pre-delivery audit — every claim is a defendant.</div>
    <div class="tag-zh">交付前的对抗性审计：每条结论都必须自证清白。</div>
  </div>
  <div class="stack">
    <div class="card c1"><div class="lbl">VERDICT</div><div class="verdict no">DO NOT DELIVER</div><div class="sub">1 claim REFUTED · evidence attached</div></div>
    <div class="card c2"><div class="lbl">VERDICT — AFTER FIXES</div><div class="verdict yes">DELIVER</div><div class="sub">residual: 2 MINOR, listed</div></div>
  </div>
</div>
